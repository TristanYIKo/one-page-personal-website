<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tristan Ko</title>
  <meta name="description" content="Tristan Ko: data and engineering. Management Engineering at Waterloo, product analyst at Allstate.">
  <meta name="theme-color" content="#F8F4EB">

  <!-- Favicon: the TK seal as an inline SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg transform='rotate(-3 32 32)' opacity='.88'%3E%3Crect x='5' y='5' width='54' height='54' rx='3' fill='%23F8F4EB' stroke='%23B8322A' stroke-width='3'/%3E%3Cg fill='%23B8322A' font-family='Georgia,serif' text-anchor='middle'%3E%3Ctext x='21.5' y='31' font-size='19'%3ET%3C/text%3E%3Ctext x='42.5' y='31' font-size='19'%3EK%3C/text%3E%3Ctext x='21.5' y='50' font-size='11'%3E20%3C/text%3E%3Ctext x='42.5' y='50' font-size='11'%3E29%3C/text%3E%3C/g%3E%3C/g%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@300;400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <script src="sky.js" defer></script>

  <!-- Vercel Web Analytics. Loads only on the Vercel deployment (tristanko.ca),
       not on GitHub Pages or local previews, where the script doesn't exist. -->
  <script>
    (function () {
      if (!/(^|\.)tristanko\.ca$|\.vercel\.app$/.test(location.hostname)) return;
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      // Count each section as its own page: /#projects/roastbot -> /projects/roastbot
      window.va("beforeSend", function (event) {
        var route = location.hash.replace(/^#\/?/, "");
        var url = new URL(event.url);
        url.hash = "";
        if (route && route !== "home") url.pathname = "/" + route;
        event.url = url.toString();
        return event;
      });
      var s = document.createElement("script");
      s.defer = true;
      s.src = "/_vercel/insights/script.js";
      document.head.appendChild(s);
    })();
  </script>
</head>
<body class="is-loading is-first" data-view="home">

  <!-- Mountains: two layers pinned to the bottom, never stretched -->
  <div class="scene" aria-hidden="true">
    <div class="mountains">
      <!-- sun by day, moon by night; placed by sky.js, sits behind both ranges -->
      <div class="sky"></div>
      <!-- three ink-wash ridges, far to near: a touch darker at the peaks, fading into
           mist. Kept close to the paper tones so they stay quiet. -->
      <svg class="mtn" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice" focusable="false">
        <defs>
          <linearGradient id="inkFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#DDD5C6"/>
            <stop offset="1" stop-color="#EDE7DC" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="inkMid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#D0C6B5"/>
            <stop offset="0.85" stop-color="#E6DED0" stop-opacity="0.4"/>
          </linearGradient>
          <linearGradient id="inkNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#C6BBA8"/>
            <stop offset="0.35" stop-color="#D8CEBD"/>
            <stop offset="1" stop-color="#E2DACB"/>
          </linearGradient>
        </defs>
        <path class="ridge ridge-far" fill="url(#inkFar)" d="M0 140 L180 80 L320 115 L520 35 L700 105 L880 65 L1060 125 L1260 45 L1440 98 L1600 70 L1600 300 L0 300 Z"/>
        <path class="ridge ridge-mid" fill="url(#inkMid)" d="M0 200 L220 155 L420 190 L640 125 L860 185 L1080 145 L1300 200 L1480 160 L1600 180 L1600 300 L0 300 Z"/>
        <path class="ridge ridge-near" fill="url(#inkNear)" d="M0 250 L280 215 L520 238 L800 205 L1080 240 L1360 212 L1600 230 L1600 300 L0 300 Z"/>
      </svg>
    </div>
  </div>

  <!--
    Only the home screen is written here. Every other view (the experience and
    project lists, each role's and project's own page, and "the rest") is built
    by script.js from the "EDIT YOUR CONTENT HERE" section at its top.
  -->
  <main class="stage" id="stage">

    <section class="view view-home" id="view-home" aria-labelledby="home-name">
      <header class="home-head">
        <div class="seal" role="img" aria-label="Seal with the initials TK and the year 2029">
          <span>T</span><span>K</span><span class="seal-small">20</span><span class="seal-small">29</span>
        </div>
        <div>
          <h1 class="name" id="home-name" tabindex="-1" data-a>Tristan Ko</h1>
          <p class="tagline" data-slot="tagline" data-a></p>
        </div>
      </header>
      <p class="fine" data-slot="roles" data-a></p>
      <p class="bio" data-slot="bio" data-a></p>
      <a class="rest-link" href="#the-rest" data-a>the rest <span class="arrow" aria-hidden="true">→</span></a>

      <div class="lists">
        <nav class="list" aria-labelledby="home-xp-label">
          <div class="list-label" data-a>
            <span id="home-xp-label">experience</span>
            <a class="view-all" href="#experience">view all <span class="arrow" aria-hidden="true">→</span></a>
          </div>
          <ul data-slot="home-experience"></ul>
        </nav>
        <nav class="list" aria-labelledby="home-pj-label">
          <div class="list-label" data-a>
            <span id="home-pj-label">projects</span>
            <a class="view-all" href="#projects">view all <span class="arrow" aria-hidden="true">→</span></a>
          </div>
          <ul data-slot="home-projects"></ul>
        </nav>
      </div>
    </section>

  </main>

  <footer class="contact">
    <nav aria-label="Contact" data-slot="links"></nav>
  </footer>

  <noscript>
    <style>.contact { opacity: 1 !important; }</style>
    <p class="noscript">This site needs JavaScript to show its content.</p>
  </noscript>
</body>
</html>
